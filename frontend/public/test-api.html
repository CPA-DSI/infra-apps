<!DOCTYPE html>
<html>
<head>
    <title>Test API Marques</title>
</head>
<body>
    <h1>Test API Marques</h1>
    <button onclick="testGetMarques()">Tester GET /api/marques</button>
    <button onclick="testPostMarque()">Tester POST /api/marques</button>
    <pre id="result"></pre>

    <script>
        const API_URL = 'http://localhost:4000/api/marques';

        async function testGetMarques() {
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = 'Chargement...';
            
            try {
                console.log('📡 Tentative de connexion à:', API_URL);
                const response = await fetch(API_URL);
                console.log('📡 Statut:', response.status);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                console.log('✅ Données reçues:', data);
                resultDiv.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                console.error('❌ Erreur:', error);
                resultDiv.textContent = `Erreur: ${error.message}`;
            }
        }

        async function testPostMarque() {
            const resultDiv = document.getElementById('result');
            const testMarque = {
                nom_marque: `Test ${Date.now()}`,
                url: 'https://example.com/logo.png'
            };
            
            resultDiv.textContent = 'Envoi...';
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(testMarque)
                });
                
                const data = await response.json();
                console.log('✅ Réponse POST:', data);
                resultDiv.textContent = JSON.stringify(data, null, 2);
                
                // Rafraîchir la liste
                setTimeout(() => testGetMarques(), 1000);
            } catch (error) {
                console.error('❌ Erreur POST:', error);
                resultDiv.textContent = `Erreur: ${error.message}`;
            }
        }
    </script>
</body>
</html>
